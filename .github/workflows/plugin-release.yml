# Builds, signs, and releases a Silo-Server plugin. Plugin repositories call
# it from a tag push; see "Shared workflows" in this repository's README.md
# for the caller contract. Callers must reference it at @main: the Sigstore
# certificate records that ref, and Silo servers accept only
# .../plugin-release.yml@refs/heads/main.
#
# Artifacts are not trusted between jobs: any job in the caller's run can
# replace an artifact by name. The binaries' checksums and the Sigstore bundle
# travel as job outputs, and the release job checks the downloaded binaries
# against those checksums before publishing.
name: Plugin release

on:
  workflow_call:
    inputs:
      platforms:
        description: Comma-separated GOOS/GOARCH pairs to build.
        type: string
        required: false
        default: linux/amd64,linux/arm64,darwin/arm64
    secrets:
      dispatch_token:
        description: Token that may send repository_dispatch to Silo-Server/silo-plugins. The catalog dispatch is skipped when unset.
        required: false

permissions: {}

jobs:
  guard:
    name: Check tag, branch, and manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      binaries: ${{ steps.platforms.outputs.binaries }}
    steps:
      - name: Check out the tagged commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag, ancestry, and manifest version
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          LC_ALL: C
        run: |
          set -euo pipefail
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'

          # semver_cmp A B prints -1, 0, or 1 by semver 2.0.0 precedence
          # (1.2.0-rc.1 < 1.2.0) and returns 2 when either is not semver.
          semver_cmp() {
            local a_core b_core a_pre b_pre i x y
            [[ "$1" =~ $semver_re ]] || return 2
            a_core=("${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}")
            a_pre="${BASH_REMATCH[5]}"
            [[ "$2" =~ $semver_re ]] || return 2
            b_core=("${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[3]}")
            b_pre="${BASH_REMATCH[5]}"
            for i in 0 1 2; do
              if ((10#${a_core[i]} < 10#${b_core[i]})); then echo -1; return 0; fi
              if ((10#${a_core[i]} > 10#${b_core[i]})); then echo 1; return 0; fi
            done
            if [ -z "$a_pre" ] && [ -z "$b_pre" ]; then echo 0; return 0; fi
            if [ -z "$a_pre" ]; then echo 1; return 0; fi
            if [ -z "$b_pre" ]; then echo -1; return 0; fi
            local -a a_ids b_ids
            IFS=. read -ra a_ids <<< "$a_pre"
            IFS=. read -ra b_ids <<< "$b_pre"
            for ((i = 0; i < ${#a_ids[@]} && i < ${#b_ids[@]}; i++)); do
              x="${a_ids[i]}"
              y="${b_ids[i]}"
              [ "$x" = "$y" ] && continue
              if [[ "$x" =~ ^[0-9]+$ && "$y" =~ ^[0-9]+$ ]]; then
                if ((10#$x < 10#$y)); then echo -1; else echo 1; fi
              elif [[ "$x" =~ ^[0-9]+$ ]]; then
                echo -1
              elif [[ "$y" =~ ^[0-9]+$ ]]; then
                echo 1
              elif [[ "$x" < "$y" ]]; then
                echo -1
              else
                echo 1
              fi
              return 0
            done
            if ((${#a_ids[@]} < ${#b_ids[@]})); then echo -1
            elif ((${#a_ids[@]} > ${#b_ids[@]})); then echo 1
            else echo 0
            fi
          }

          # manifest_version COMMIT prints .version, or nothing when the
          # commit has no readable manifest.json.
          manifest_version() {
            git show "${1}:manifest.json" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true
          }

          if [ "$EVENT_NAME" != "push" ]; then
            echo "::error::Plugin releases run only from a tag push (got event '${EVENT_NAME}')."
            exit 1
          fi
          tag="${REF#refs/tags/}"
          version="${tag#v}"
          if [ "$tag" = "$REF" ] || [ "$version" = "$tag" ] || ! [[ "$version" =~ $semver_re ]]; then
            echo "::error::Ref '${REF}' is not refs/tags/vMAJOR.MINOR.PATCH[-PRERELEASE]."
            exit 1
          fi

          tag_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Tag ${tag} points at ${tag_commit}, but this run is for ${GITHUB_SHA}."
            exit 1
          fi
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null || {
            echo "::error::origin/main was not fetched."
            exit 1
          }
          # Only commits that landed on main itself (its first-parent chain)
          # are releasable; commits inside a merged branch are not.
          # grep -c reads all of rev-list's output; grep -q would exit early
          # and fail the pipeline under pipefail on a long history.
          if ! git rev-list --first-parent refs/remotes/origin/main | grep -cxF "$GITHUB_SHA" >/dev/null; then
            echo "::error::Tag ${tag} (${GITHUB_SHA}) is not a commit on main's first-parent history. Tag the commit on main that bumped manifest.json."
            exit 1
          fi

          tagged_version="$(git show "${GITHUB_SHA}:manifest.json" | jq -er '.version')"
          if [ "$tagged_version" != "$version" ]; then
            echo "::error file=manifest.json::manifest.json version is '${tagged_version}', but the tag is ${tag}."
            exit 1
          fi

          # Exactly one commit per version is releasable: the one that raised
          # manifest.json .version above its first parent's. A root commit, or a
          # parent without manifest.json, counts as a raise.
          parent_version=""
          if git rev-parse --verify --quiet "${GITHUB_SHA}^1" >/dev/null; then
            parent_version="$(manifest_version "${GITHUB_SHA}^1")"
          fi
          if [ -n "$parent_version" ]; then
            cmp="$(semver_cmp "$version" "$parent_version")" || {
              echo "::error::The first parent's manifest.json version '${parent_version}' is not semver, so ${version} cannot be shown to be a raise."
              exit 1
            }
            if [ "$cmp" != "1" ]; then
              echo "::error::${GITHUB_SHA} does not raise manifest.json version above its first parent's (${parent_version}). Tag the commit on main that bumped it to ${version}."
              exit 1
            fi
          fi

          # A bump that main later reverted is not releasable: no later
          # first-parent commit on main may set a lower version.
          while read -r later; do
            later_version="$(manifest_version "$later")"
            cmp=""
            if [ -n "$later_version" ]; then
              cmp="$(semver_cmp "$later_version" "$version")" || cmp=""
            fi
            if [ -z "$cmp" ] || [ "$cmp" = "-1" ]; then
              echo "::error::main later moved manifest.json version from ${version} to '${later_version}' (${later}); the ${version} bump was reverted. Release a new version instead."
              exit 1
            fi
          done < <(git rev-list --first-parent "${GITHUB_SHA}..refs/remotes/origin/main" -- manifest.json)

          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

      - name: Parse platforms
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          platforms=()
          names=()
          IFS=',' read -ra entries <<< "$PLATFORMS"
          for entry in "${entries[@]}"; do
            entry="${entry//[[:space:]]/}"
            [ -n "$entry" ] || continue
            if ! [[ "$entry" =~ ^([a-z0-9]+)/([a-z0-9]+)$ ]]; then
              echo "::error::Platform '${entry}' is not GOOS/GOARCH."
              exit 1
            fi
            name="plugin-${BASH_REMATCH[1]}-${BASH_REMATCH[2]}"
            if [[ " ${names[*]} " == *" ${name} "* ]]; then
              continue
            fi
            platforms+=("$entry")
            names+=("$name")
          done
          if [ "${#names[@]}" -eq 0 ]; then
            echo "::error::The platforms input lists no platforms."
            exit 1
          fi
          echo "platforms=${platforms[*]}" >> "$GITHUB_OUTPUT"
          echo "binaries=${names[*]}" >> "$GITHUB_OUTPUT"

  # One job builds every platform, so it can return all checksums as a single
  # output (a matrix cannot return per-leg outputs for a dynamic list).
  build:
    name: Build binaries
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      checksums: ${{ steps.build.outputs.checksums }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false

      # No module or build cache: a release must not consume cache entries
      # that other workflow runs in the repository could have written.
      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Reject silo-plugin-sdk and machine-local replaces
        run: |
          set -euo pipefail
          bad="$(go mod edit -json | jq -r '
            .Replace // [] | .[]
            | select(.Old.Path == "github.com/Silo-Server/silo-plugin-sdk"
                     or (.New.Path | startswith("/"))
                     or (.New.Path | startswith("../")))
            | "\(.Old.Path) => \(.New.Path) \(.New.Version // "")"')"
          if [ -n "$bad" ]; then
            echo "::error file=go.mod::go.mod has replace directives a release cannot use; use a local go.work instead:"
            echo "$bad"
            exit 1
          fi

      - name: Build
        id: build
        env:
          PLATFORMS: ${{ needs.guard.outputs.platforms }}
          VERSION: ${{ needs.guard.outputs.version }}
          CGO_ENABLED: "0"
          GOWORK: "off"
          GOFLAGS: -mod=readonly
          GOPROXY: direct
          GOPRIVATE: github.com/Silo-Server/*
          GONOSUMDB: github.com/Silo-Server/*
        run: |
          set -euo pipefail
          mkdir -p dist
          names=()
          for platform in $PLATFORMS; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            name="plugin-${goos}-${goarch}"
            echo "Building ${name}"
            GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "dist/${name}" .
            names+=("$name")
          done
          (cd dist && sha256sum "${names[@]}") > checksums.txt
          cat checksums.txt
          # base64 keeps the multi-line file a single-line job output.
          echo "checksums=$(base64 -w0 checksums.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-binaries
          path: dist/
          if-no-files-found: error
          retention-days: 5

  # Holds the signing permissions. It runs no repository code, checks nothing
  # out, and downloads nothing: its subjects are the checksums the build job
  # returned as an output.
  attest:
    name: Sign binaries
    needs: [guard, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      bundle: ${{ steps.bundle.outputs.bundle }}
    steps:
      - name: Write and check the subject list
        env:
          CHECKSUMS: ${{ needs.build.outputs.checksums }}
          BINARIES: ${{ needs.guard.outputs.binaries }}
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/subjects.txt"
          printf '%s' "$CHECKSUMS" | base64 -d > "$file"
          if grep -Evx '[0-9a-f]{64}  plugin-[a-z0-9]+-[a-z0-9]+' "$file"; then
            echo "::error::The build job's checksums have an unexpected line (above)."
            exit 1
          fi
          expected="$(tr ' ' '\n' <<< "$BINARIES" | sort)"
          actual="$(awk '{print $2}' "$file" | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::The build job's checksums do not match the platform list."
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual"
            exit 1
          fi
          cat "$file"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt

      - name: Return the bundle
        id: bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          jq -e '.mediaType' "$BUNDLE_PATH" >/dev/null
          encoded="$(base64 -w0 "$BUNDLE_PATH")"
          # Job outputs are capped at 1 MB per job, counted as UTF-16.
          if [ "${#encoded}" -gt 400000 ]; then
            echo "::error::The Sigstore bundle is too large to return as a job output (${#encoded} base64 characters)."
            exit 1
          fi
          echo "bundle=${encoded}" >> "$GITHUB_OUTPUT"

  release:
    name: Publish release
    needs: [guard, build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-binaries
          path: release

      - name: Check binaries against the build job's checksums
        env:
          CHECKSUMS: ${{ needs.build.outputs.checksums }}
          BUNDLE: ${{ needs.attest.outputs.bundle }}
          BINARIES: ${{ needs.guard.outputs.binaries }}
        run: |
          set -euo pipefail
          expected="$(tr ' ' '\n' <<< "$BINARIES" | sort)"
          actual="$(find release -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::The downloaded artifact does not hold exactly the expected binaries."
            printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual"
            exit 1
          fi
          printf '%s' "$CHECKSUMS" | base64 -d > release/checksums.txt
          if grep -Evx '[0-9a-f]{64}  plugin-[a-z0-9]+-[a-z0-9]+' release/checksums.txt; then
            echo "::error::The build job's checksums have an unexpected line (above)."
            exit 1
          fi
          if [ "$expected" != "$(awk '{print $2}' release/checksums.txt | sort)" ]; then
            echo "::error::The build job's checksums do not match the platform list."
            exit 1
          fi
          (cd release && sha256sum --check --strict checksums.txt)
          printf '%s' "$BUNDLE" | base64 -d > release/plugin.sigstore.json
          jq -e '.mediaType' release/plugin.sigstore.json >/dev/null

      # Checks the bundle against the identity Silo servers pin, so a release
      # that servers would refuse (for example one called at a ref other than
      # @main) is never published.
      - name: Verify the bundle against the pinned identity
        env:
          GH_TOKEN: ${{ github.token }}
          BINARIES: ${{ needs.guard.outputs.binaries }}
          TAG: ${{ needs.guard.outputs.tag }}
          SIGNER: https://github.com/Silo-Server/.github/.github/workflows/plugin-release.yml@refs/heads/main
        run: |
          set -euo pipefail
          for binary in $BINARIES; do
            gh attestation verify "release/${binary}" \
              --bundle release/plugin.sigstore.json \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$SIGNER" \
              --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --source-ref "refs/tags/${TAG}" \
              --deny-self-hosted-runners
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BINARIES: ${{ needs.guard.outputs.binaries }}
          TAG: ${{ needs.guard.outputs.tag }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          set -euo pipefail
          files=()
          for binary in $BINARIES; do
            files+=("release/${binary}")
          done
          files+=(release/checksums.txt release/plugin.sigstore.json)
          flags=(--repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}" "${files[@]}"

  # Separate from release so a failed dispatch can be re-run on its own;
  # re-running release fails once the release exists.
  dispatch:
    name: Notify the silo-plugins catalog
    needs: [guard, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send plugin_release_published
        env:
          DISPATCH_TOKEN: ${{ secrets.dispatch_token }}
          TAG: ${{ needs.guard.outputs.tag }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            echo "${TAG} is a prerelease; skipping the catalog dispatch."
            exit 0
          fi
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "dispatch_token is not set; skipping the catalog dispatch."
            exit 0
          fi
          payload="$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg tag "$TAG" \
            '{event_type: "plugin_release_published", client_payload: {repo: $repo, tag: $tag}}')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Silo-Server/silo-plugins/dispatches \
            -d "$payload"
